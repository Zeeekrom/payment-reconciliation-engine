name: codeql

# CodeQL code scanning for the Python in this snapshot (free for public repositories).
# Results appear under Security > Code scanning; this check does not block merging.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 16 * * 1" # weekly, Tuesday 02:30 or 03:30 Hobart time

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:python
