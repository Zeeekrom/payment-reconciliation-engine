# Weekly update proposals. Each is a pull request that must pass the tests; the owner reviews and merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Australia/Hobart
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Australia/Hobart
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
